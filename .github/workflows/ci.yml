name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Run smoke and contract tests
        run: npm test

      - name: Verify clean Studio build
        run: npm run test:build

      - name: Build packaged Studio assets
        run: npm run build:studio

      - name: Report architecture budgets
        run: npm run architecture:check

      - name: Audit production dependencies
        run: npm audit --audit-level=high
